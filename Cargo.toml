[package]
name = "ja-colloquial-api"
version = "0.1.0"
edition = "2024"

authors = ["metastable-void"]
description = "Japanese Colloquial Christian Bible HTTP API."
license = "Apache-2.0 OR MPL-2.0"
readme = "README.md"
repository = "https://github.com/metastable-void/ja-colloquial-api"
homepage = "https://github.com/metastable-void/ja-colloquial-api"

[dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"], default-features = false }
hyper-util = { version = "0.1", features = ["http1", "server", "tokio"] }
ja-colloquial = "0.1.0"
serde_json = "1.0.145"
tokio = { version = "1", features = ["full"] }

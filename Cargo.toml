[package]
name = "ja-colloquial-api"
version = "0.1.0"
edition = "2024"

[dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"], default-features = false }
hyper-util = { version = "0.1", features = ["http1", "server", "tokio"] }
ja-colloquial = "0.1.0"
serde_json = "1.0.145"
tokio = { version = "1", features = ["full"] }
